syntax = "proto3";

package apic;


option go_package = "github.com/protosio/protos/internal/apic;proto";

service ProtosClientApi {
  rpc Init(InitRequest) returns (InitResponse) {}
  rpc GetUserDevices(GetUserDevicesRequest) returns (GetUserDevicesResponse) {}
  rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoResponse) {}
  rpc GetLocalSSHKey(GetLocalSSHKeyRequest) returns (GetLocalSSHKeyResponse) {}
  rpc GetApps(GetAppsRequest) returns (GetAppsResponse) {}
  rpc CreateApp(CreateAppRequest) returns (CreateAppResponse) {}
  rpc StartApp(StartAppRequest) returns (StartAppResponse) {}
  rpc StopApp(StopAppRequest) returns (StopAppResponse) {}
  rpc RemoveApp(RemoveAppRequest) returns (RemoveAppResponse) {}
  rpc GetAppLogs(GetAppLogsRequest) returns (GetAppLogsResponse) {}
  rpc GetSupportedCloudProviders(GetSupportedCloudProvidersRequest) returns (GetSupportedCloudProvidersResponse) {}
  rpc GetCloudProviders(GetCloudProvidersRequest) returns (GetCloudProvidersResponse) {}
  rpc GetCloudProvider(GetCloudProviderRequest) returns (GetCloudProviderResponse) {}
  rpc AddCloudProvider(AddCloudProviderRequest) returns (AddCloudProviderResponse) {}
  rpc RemoveCloudProvider(RemoveCloudProviderRequest) returns (RemoveCloudProviderResponse) {}
  rpc GetSupportedProvisioners(GetSupportedProvisionersRequest) returns (GetSupportedProvisionersResponse) {}
  rpc GetProvisioners(GetProvisionersRequest) returns (GetProvisionersResponse) {}
  rpc GetProvisioner(GetProvisionerRequest) returns (GetProvisionerResponse) {}
  rpc AddProvisioner(AddProvisionerRequest) returns (AddProvisionerResponse) {}
  rpc RemoveProvisioner(RemoveProvisionerRequest) returns (RemoveProvisionerResponse) {}
  rpc GetInstances(GetInstancesRequest) returns (GetInstancesResponse) {}
  rpc GetInstance(GetInstanceRequest) returns (GetInstanceResponse) {}
  rpc GetInstanceDeployOptions(GetInstanceDeployOptionsRequest) returns (GetInstanceDeployOptionsResponse) {}
  rpc DeployInstance(DeployInstanceRequest) returns (DeployInstanceResponse) {}
  rpc RemoveInstance(RemoveInstanceRequest) returns (RemoveInstanceResponse) {}
  rpc StartInstance(StartInstanceRequest) returns (StartInstanceResponse) {}
  rpc StopInstance(StopInstanceRequest) returns (StopInstanceResponse) {}
  rpc GetInstanceKey(GetInstanceKeyRequest) returns (GetInstanceKeyResponse) {}
  rpc GetInstanceLogs(GetInstanceLogsRequest) returns (GetInstanceLogsResponse) {}
  rpc InitInstance(InitInstanceRequest) returns (InitInstanceResponse) {}
  rpc UpdateInstance(UpdateInstanceRequest) returns (UpdateInstanceResponse) {}
  rpc GetNetworkState(GetNetworkStateRequest) returns (GetNetworkStateResponse) {}
  rpc GetExitRoutes(GetExitRoutesRequest) returns (GetExitRoutesResponse) {}
  rpc GetRuntimeState(GetRuntimeStateRequest) returns (GetRuntimeStateResponse) {}
  rpc WatchChanges(WatchChangesRequest) returns (stream WatchChangesResponse) {}
  rpc GetTasks(GetTasksRequest) returns (GetTasksResponse) {}
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse) {}
  rpc SetExitRoute(SetExitRouteRequest) returns (SetExitRouteResponse) {}
  rpc ClearExitRoute(ClearExitRouteRequest) returns (ClearExitRouteResponse) {}
  rpc GetProtosdReleases(GetProtosdReleasesRequest) returns (GetProtosdReleasesResponse) {}
  rpc GetCloudImages(GetCloudImagesRequest) returns (GetCloudImagesResponse) {}
  rpc UploadCloudImage(UploadCloudImageRequest) returns (UploadCloudImageResponse) {}
  rpc RemoveCloudImage(RemoveCloudImageRequest) returns (RemoveCloudImageResponse) {}
  rpc GetProvisionerImages(GetProvisionerImagesRequest) returns (GetProvisionerImagesResponse) {}
  rpc UploadProvisionerImage(UploadProvisionerImageRequest) returns (UploadProvisionerImageResponse) {}
  rpc RemoveProvisionerImage(RemoveProvisionerImageRequest) returns (RemoveProvisionerImageResponse) {}
  rpc GetSystemStatus(GetSystemStatusRequest) returns (GetSystemStatusResponse) {}
  rpc GetLocalCommits(GetLocalCommitsRequest) returns (GetLocalCommitsResponse) {}
  rpc GetRemoteCommits(GetRemoteCommitsRequest) returns (GetRemoteCommitsResponse) {}
  rpc ExecuteSql(ExecuteSqlRequest) returns (ExecuteSqlResponse) {}
}

message InitRequest {
  string username = 1;
  string name = 2;
  string organization = 3;
}

message InitResponse {
}

message UserDevice {
  string id = 1;
  string name = 2;
  string public_key = 3;
  string public_key_wireguard = 4;
}

message GetUserDevicesRequest {
}

message GetUserDevicesResponse {
  repeated UserDevice devices = 1;
}

message GetUserInfoRequest {
}

message GetUserInfoResponse {
  string username = 1;
  string name = 2;
  bool is_admin = 3;
}

message GetLocalSSHKeyRequest {
}

message GetLocalSSHKeyResponse {
  string public = 1;
  string private = 2;
}

message App {
  string id = 1;
  string name = 2;
  string version = 3;
  string status = 4;
  string instance_name = 5;
  string ip = 6;
  string installer = 7;
  bool persistence = 8;
}

message GetAppsRequest {
}

message GetAppsResponse {
  repeated App apps = 1;
}

message CreateAppRequest {
  string name = 1;
  string installer_id = 2;
  string instance_id = 3;
  bool persistence = 4;
}

message CreateAppResponse {
  string id = 1;
}

message StartAppRequest {
  string name = 1;
}

message StartAppResponse {
}

message StopAppRequest {
  string name = 1;
}

message StopAppResponse {
}

message RemoveAppRequest {
  string name = 1;
}

message RemoveAppResponse {
}

message GetAppLogsRequest {
  string name = 1;
}

message GetAppLogsResponse {
  bytes logs = 1;
}

message Installer {
  string id = 1;
  string name = 2;
  string version = 3;
  string description = 4;
  repeated string requires_resources = 5;
  repeated string provides_resources = 6;
  repeated string capabilities = 7;
}

message GetInstallersRequest {
}

message GetInstallersResponse {
  repeated Installer installers = 1;
}

message GetInstallerRequest {
  string id = 1;
}

message GetInstallerResponse {
  Installer installer = 1;
}

message CloudMachineSpec {
  int32 cores = 1;
  int32 memory = 2;
  int32 default_storage = 3;
  int32 bandwidth = 4;
  int32 included_data_transfer = 5;
  bool baremetal = 6;
  float price_monthly = 7;
}

message CloudType {
  string name = 1;
  repeated string authentication_fields = 2;
}

message CloudProvider {
  string name = 1;
  CloudType type = 2;
  repeated string supported_locations = 3;
  map<string, CloudMachineSpec> supported_machines = 4;
}

message GetSupportedCloudProvidersRequest {
}

message GetSupportedCloudProvidersResponse {
  repeated CloudType cloud_types = 1;
}

message GetCloudProvidersRequest {
}

message GetCloudProvidersResponse {
  repeated CloudProvider cloud_providers = 1;
}

message GetCloudProviderRequest {
  string name = 1;
}

message GetCloudProviderResponse {
  CloudProvider cloud_provider = 1;
}

message AddCloudProviderRequest {
  string name = 1;
  string type = 2;
  map<string, string> credentials = 3;
}

message AddCloudProviderResponse {
}

message RemoveCloudProviderRequest {
  string name = 1;
}

message RemoveCloudProviderResponse {
}

message ProvisionerMachineSpec {
  int32 cores = 1;
  int32 memory = 2;
  int32 default_storage = 3;
  int32 bandwidth = 4;
  int32 included_data_transfer = 5;
  bool baremetal = 6;
  float price_monthly = 7;
}

message ProvisionerType {
  string name = 1;
  repeated string authentication_fields = 2;
}

message Provisioner {
  string name = 1;
  ProvisionerType type = 2;
  repeated string supported_locations = 3;
  map<string, ProvisionerMachineSpec> supported_machines = 4;
}

message GetSupportedProvisionersRequest {
}

message GetSupportedProvisionersResponse {
  repeated ProvisionerType provisioner_types = 1;
}

message GetProvisionersRequest {
}

message GetProvisionersResponse {
  repeated Provisioner provisioners = 1;
}

message GetProvisionerRequest {
  string name = 1;
}

message GetProvisionerResponse {
  Provisioner provisioner = 1;
}

message AddProvisionerRequest {
  string name = 1;
  string type = 2;
  map<string, string> credentials = 3;
}

message AddProvisionerResponse {
}

message RemoveProvisionerRequest {
  string name = 1;
}

message RemoveProvisionerResponse {
}

message CloudInstance {
  string name = 1;
  string public_ip = 2;
  string internal_ip = 3;
  string cloud_name = 4;
  string cloud_type = 5;
  string vm_id = 6;
  string location = 7;
  string public_key = 8;
  string public_key_wireguard = 9;
  string protos_version = 10;
  string status = 11;
  string architecture = 12;
  map<string, string> peers = 13;
}

message GetInstancesRequest {
}

message GetInstancesResponse {
  repeated CloudInstance instances = 1;
}

message GetInstanceRequest {
  string name = 1;
}

message GetInstanceResponse {
  CloudInstance instance = 1;
}

message InstanceDeployFieldOption {
  string value = 1;
  string label = 2;
  string description = 3;
}

message InstanceDeployField {
  string name = 1;
  string label = 2;
  string kind = 3;
  bool required = 4;
  bool visible = 5;
  string value = 6;
  string helper = 7;
  repeated InstanceDeployFieldOption options = 8;
}

message GetInstanceDeployOptionsRequest {
  string provisioner = 1;
  string location = 2;
}

message GetInstanceDeployOptionsResponse {
  repeated InstanceDeployField fields = 1;
}

message DeployInstanceRequest {
  string name = 1;
  string cloud_name = 2;
  string cloud_location = 3;
  string machine_type = 4;
  string protos_version = 5;
  string dev_img = 6;
}

message DeployInstanceResponse {
  CloudInstance instance = 1;
}

message RemoveInstanceRequest {
  string name = 1;
  bool local_only = 2;
}

message RemoveInstanceResponse {
}

message StartInstanceRequest {
  string name = 1;
}

message StartInstanceResponse {
}

message StopInstanceRequest {
  string name = 1;
}

message StopInstanceResponse {
}

message GetInstanceKeyRequest {
  string name = 1;
}

message GetInstanceKeyResponse {
  string key = 1;
}

message GetInstanceLogsRequest {
  string name = 1;
}

message GetInstanceLogsResponse {
  string logs = 1;
}

message InitInstanceRequest {
  string name = 1;
  string ip = 2;
}

message InitInstanceResponse {
}

message UpdateInstanceRequest {
  string id = 1;
  string ip = 2;
}

message UpdateInstanceResponse {
}

message GetNetworkStateRequest {
  string instance = 1;
}

message GetNetworkStateResponse {
  NetworkState state = 1;
}

message NetworkState {
  string module = 1;
  bool up = 2;
  string interface_name = 3;
  repeated NetworkAddress addresses = 4;
  repeated NetworkRoute routes = 5;
  repeated WireGuardPeer wireguard_peers = 6;
  repeated FirewallTable firewall_tables = 7;
  repeated DNSState dns = 8;
  repeated string messages = 9;
  repeated NetworkInterface interfaces = 10;
}

message NetworkInterface {
  string name = 1;
  string type = 2;
  int32 index = 3;
  int32 mtu = 4;
  bool up = 5;
  string master = 6;
  string mac_address = 7;
  string kind = 8;
}

message NetworkAddress {
  string interface_name = 1;
  string cidr = 2;
  string scope = 3;
}

message NetworkRoute {
  string interface_name = 1;
  string destination = 2;
  string gateway = 3;
  string source = 4;
  string family = 5;
  string table = 6;
  string protocol = 7;
  string scope = 8;
  string priority = 9;
  string kind = 10;
}

message WireGuardPeer {
  string public_key = 1;
  string endpoint = 2;
  repeated string allowed_ips = 3;
  string latest_handshake = 4;
  uint64 rx_bytes = 5;
  uint64 tx_bytes = 6;
}

message FirewallTable {
  string family = 1;
  string name = 2;
  repeated FirewallChain chains = 3;
}

message FirewallChain {
  string name = 1;
  string type = 2;
  string hook = 3;
  string priority = 4;
  repeated FirewallRule rules = 5;
}

message FirewallRule {
  repeated string expressions = 1;
  uint64 packets = 2;
  uint64 bytes = 3;
}

message DNSState {
  string scope = 1;
  string domain = 2;
  repeated string servers = 3;
  int32 port = 4;
  bool active = 5;
  string source = 6;
}

message ExitRoute {
  string id = 1;
  string device_id = 2;
  string instance_id = 3;
  string instance_name = 4;
  string public_ip = 5;
  string location = 6;
  string status = 7;
  string dns_server = 8;
  repeated string cidrs = 9;
}

message GetExitRoutesRequest {
  string instance = 1;
}

message GetExitRoutesResponse {
  repeated ExitRoute routes = 1;
}

message GetRuntimeStateRequest {
  string instance = 1;
}

message GetRuntimeStateResponse {
  RuntimeState state = 1;
}

message WatchChangesRequest {
  bool include_snapshot = 1;
  uint32 heartbeat_interval_ms = 2;
}

message WatchChangesResponse {
  uint64 sequence = 1;
  repeated string table_names = 2;
  bool runtime_changed = 3;
  string reason = 4;
}

message Task {
  string id = 1;
  string stream = 2;
  string subject_type = 3;
  string subject_id = 4;
  string status = 5;
  string title = 6;
  string message = 7;
  int32 progress = 8;
  string payload_json = 9;
  string result_json = 10;
  string error_message = 11;
  int32 attempts = 12;
  int32 max_attempts = 13;
  string created_at = 14;
  string updated_at = 15;
  string started_at = 16;
  string finished_at = 17;
}

message TaskEvent {
  string id = 1;
  string task_id = 2;
  string status = 3;
  string message = 4;
  int32 progress = 5;
  string details_json = 6;
  string created_at = 7;
}

message GetTasksRequest {
  string status = 1;
  string stream = 2;
  string subject_type = 3;
  string subject_id = 4;
  int32 max_results = 5;
}

message GetTasksResponse {
  repeated Task tasks = 1;
  bool truncated = 2;
}

message GetTaskRequest {
  string id = 1;
  bool include_events = 2;
}

message GetTaskResponse {
  Task task = 1;
  repeated TaskEvent events = 2;
}

message SetExitRouteRequest {
  string instance = 1;
  string device_id = 2;
  string dns_server = 3;
  repeated string cidrs = 4;
}

message SetExitRouteResponse {
  ExitRoute route = 1;
}

message ClearExitRouteRequest {
  string device_id = 1;
}

message ClearExitRouteResponse {
}

message RuntimeState {
  string peer_id = 1;
  string manifest_digest = 2;
  string finalized_root_hash = 3;
  string tentative_root_hash = 4;
  string protocol_finalized_root_hash = 5;
  string durable_main_root_hash = 6;
  string active_epoch_id = 7;
  repeated string active_witness_ids = 8;
  repeated string eligible_witness_ids = 9;
  repeated string state_providers = 10;
  repeated string connected_peers = 11;
  string fatal_state = 12;
  bool runtime_refresh_pending = 13;
  string runtime_refresh_last_error = 14;
  bool runtime_finalized_pending = 15;
  string runtime_finalized_last_error = 16;
  string runtime_materialization_policy = 17;
  repeated RuntimePeerStatus peer_statuses = 18;
  repeated RuntimeCompatibility compatibility = 19;
  repeated string content_sync_trace = 20;
  repeated string known_epoch_ids = 21;
  map<string, string> epoch_descriptor_digest_by_id = 22;
  map<string, string> epoch_finalized_digest_by_id = 23;
  string protocol_finalized_digest = 24;
}

message RuntimePeerStatus {
  string peer_id = 1;
  bool connected = 2;
  bool dialable = 3;
  bool state_provider = 4;
  bool witness = 5;
  bool eligible_witness = 6;
  bool compatible = 7;
  bool incompatible = 8;
  bool ignored = 9;
  bool relay_only = 10;
  repeated string addresses = 11;
  map<string, string> last_dial_errors = 12;
  string reason = 13;
}

message RuntimeCompatibility {
  string peer_id = 1;
  string local_digest = 2;
  string remote_digest = 3;
  bool compatible = 4;
  bool blocking = 5;
  string reason = 6;
}

message CloudImage {
  string provider = 1;
  string url = 2;
  string digest = 3;
  int64 release_date = 4;
}

message CloudSpecificImage {
  string id = 1;
  string name = 2;
  string location = 3;
}

message Release {
  map<string, CloudImage> cloud_images = 1;
  string version = 2;
  string description = 3;
  int64 release_date = 4;
}

message GetProtosdReleasesRequest {
}

message GetProtosdReleasesResponse {
  repeated Release releases = 1;
}

message GetCloudImagesRequest {
  string name = 1;
}

message GetCloudImagesResponse {
  map<string, CloudSpecificImage> cloud_images = 1;
}

message GetProvisionerImagesRequest {
  string name = 1;
}

message GetProvisionerImagesResponse {
  map<string, CloudSpecificImage> images = 1;
}

message UploadCloudImageRequest {
  string image_path = 1;
  string image_name = 2;
  string cloud_name = 3;
  string cloud_location = 4;
  int32 timeout = 5;
}

message UploadCloudImageResponse {
}

message UploadProvisionerImageRequest {
  string image_path = 1;
  string image_name = 2;
  string provisioner_name = 3;
  string location = 4;
  int32 timeout = 5;
}

message UploadProvisionerImageResponse {
}

message RemoveCloudImageRequest {
  string image_name = 2;
  string cloud_name = 3;
  string cloud_location = 4;
}

message RemoveCloudImageResponse {
}

message RemoveProvisionerImageRequest {
  string image_name = 1;
  string provisioner_name = 2;
  string location = 3;
}

message RemoveProvisionerImageResponse {
}

message CoreEndpoint {
  string kind = 1;
  string address = 2;
  bool active = 3;
  string message = 4;
}

message HostAgentConnectionStatus {
  bool connected = 1;
  string socket = 2;
  string message = 3;
}

message SystemStatus {
  string core_status = 1;
  string work_dir = 2;
  string capabilities = 3;
  int32 p2p_port = 4;
  repeated CoreEndpoint endpoints = 5;
  HostAgentConnectionStatus host_agent = 6;
}

message GetSystemStatusRequest {
}

message GetSystemStatusResponse {
  SystemStatus status = 1;
}

message Commit {
  string hash = 1;
  string committer = 2;
  string message = 3;
  repeated string states = 4;
  int64 date_unix = 5;
}

message GetLocalCommitsRequest {
}

message GetLocalCommitsResponse {
  repeated Commit commits = 1;
}

message GetRemoteCommitsRequest {
  string remote = 1;
}

message GetRemoteCommitsResponse {
  repeated Commit commits = 1;
}

message SqlCell {
  string value = 1;
  bool is_null = 2;
}

message SqlRow {
  repeated SqlCell cells = 1;
}

message ExecuteSqlRequest {
  string sql = 1;
  int32 max_rows = 2;
}

message ExecuteSqlResponse {
  repeated string columns = 1;
  repeated SqlRow rows = 2;
  int64 rows_affected = 3;
  bool truncated = 4;
  string message = 5;
}
