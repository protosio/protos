syntax = "proto3";

package apic;


option go_package = "github.com/protosio/protos/internal/apic;proto";

service ProtosClientApi {
  rpc Init(InitRequest) returns (InitResponse) {}
  rpc GetUserDevices(GetUserDevicesRequest) returns (GetUserDevicesResponse) {}
  rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoResponse) {}
  rpc ListOrganisations(ListOrganisationsRequest) returns (ListOrganisationsResponse) {}
  rpc StartDeviceInvite(StartDeviceInviteRequest) returns (StartDeviceInviteResponse) {}
  rpc ListNearbyOrganisations(ListNearbyOrganisationsRequest) returns (ListNearbyOrganisationsResponse) {}
  rpc JoinOrganisation(JoinOrganisationRequest) returns (JoinOrganisationResponse) {}
  rpc GetLocalSSHKey(GetLocalSSHKeyRequest) returns (GetLocalSSHKeyResponse) {}
  rpc GetApps(GetAppsRequest) returns (GetAppsResponse) {}
  rpc CreateApp(CreateAppRequest) returns (CreateAppResponse) {}
  rpc StartApp(StartAppRequest) returns (StartAppResponse) {}
  rpc StopApp(StopAppRequest) returns (StopAppResponse) {}
  rpc RemoveApp(RemoveAppRequest) returns (RemoveAppResponse) {}
  rpc GetAppLogs(GetAppLogsRequest) returns (GetAppLogsResponse) {}
  rpc GetSupportedCloudProviders(GetSupportedCloudProvidersRequest) returns (GetSupportedCloudProvidersResponse) {}
  rpc GetCloudProviders(GetCloudProvidersRequest) returns (GetCloudProvidersResponse) {}
  rpc GetCloudProvider(GetCloudProviderRequest) returns (GetCloudProviderResponse) {}
  rpc AddCloudProvider(AddCloudProviderRequest) returns (AddCloudProviderResponse) {}
  rpc RemoveCloudProvider(RemoveCloudProviderRequest) returns (RemoveCloudProviderResponse) {}
  rpc GetSupportedProvisioners(GetSupportedProvisionersRequest) returns (GetSupportedProvisionersResponse) {}
  rpc GetProvisioners(GetProvisionersRequest) returns (GetProvisionersResponse) {}
  rpc GetProvisioner(GetProvisionerRequest) returns (GetProvisionerResponse) {}
  rpc AddProvisioner(AddProvisionerRequest) returns (AddProvisionerResponse) {}
  rpc RemoveProvisioner(RemoveProvisionerRequest) returns (RemoveProvisionerResponse) {}
  rpc GetInstances(GetInstancesRequest) returns (GetInstancesResponse) {}
  rpc GetInstance(GetInstanceRequest) returns (GetInstanceResponse) {}
  rpc GetInstanceDeployOptions(GetInstanceDeployOptionsRequest) returns (GetInstanceDeployOptionsResponse) {}
  rpc DeployInstance(DeployInstanceRequest) returns (DeployInstanceResponse) {}
  rpc RemoveInstance(RemoveInstanceRequest) returns (RemoveInstanceResponse) {}
  rpc StartInstance(StartInstanceRequest) returns (StartInstanceResponse) {}
  rpc StopInstance(StopInstanceRequest) returns (StopInstanceResponse) {}
  rpc GetInstanceKey(GetInstanceKeyRequest) returns (GetInstanceKeyResponse) {}
  rpc GetInstanceLogs(GetInstanceLogsRequest) returns (GetInstanceLogsResponse) {}
  rpc InitInstance(InitInstanceRequest) returns (InitInstanceResponse) {}
  rpc UpdateInstance(UpdateInstanceRequest) returns (UpdateInstanceResponse) {}
  rpc GetNetworkState(GetNetworkStateRequest) returns (GetNetworkStateResponse) {}
  rpc SetNetworkEnabled(SetNetworkEnabledRequest) returns (SetNetworkEnabledResponse) {}
  rpc GetExitRoutes(GetExitRoutesRequest) returns (GetExitRoutesResponse) {}
  rpc GetMobileTunnelConfig(GetMobileTunnelConfigRequest) returns (GetMobileTunnelConfigResponse) {}
  rpc GetRuntimeState(GetRuntimeStateRequest) returns (GetRuntimeStateResponse) {}
  rpc WatchChanges(WatchChangesRequest) returns (stream WatchChangesResponse) {}
  rpc GetTasks(GetTasksRequest) returns (GetTasksResponse) {}
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse) {}
  rpc WatchTask(WatchTaskRequest) returns (stream WatchTaskResponse) {}
  rpc SetExitRoute(SetExitRouteRequest) returns (SetExitRouteResponse) {}
  rpc ClearExitRoute(ClearExitRouteRequest) returns (ClearExitRouteResponse) {}
  rpc GetProtosdReleases(GetProtosdReleasesRequest) returns (GetProtosdReleasesResponse) {}
  rpc GetCloudImages(GetCloudImagesRequest) returns (GetCloudImagesResponse) {}
  rpc UploadCloudImage(UploadCloudImageRequest) returns (UploadCloudImageResponse) {}
  rpc RemoveCloudImage(RemoveCloudImageRequest) returns (RemoveCloudImageResponse) {}
  rpc GetProvisionerImages(GetProvisionerImagesRequest) returns (GetProvisionerImagesResponse) {}
  rpc UploadProvisionerImage(UploadProvisionerImageRequest) returns (UploadProvisionerImageResponse) {}
  rpc RemoveProvisionerImage(RemoveProvisionerImageRequest) returns (RemoveProvisionerImageResponse) {}
  rpc GetInstanceImage(GetInstanceImageRequest) returns (GetInstanceImageResponse) {}
  rpc UploadInstanceImageArchive(UploadInstanceImageArchiveRequest) returns (UploadInstanceImageArchiveResponse) {}
  rpc GetSystemStatus(GetSystemStatusRequest) returns (GetSystemStatusResponse) {}
  rpc StartHostAgent(StartHostAgentRequest) returns (StartHostAgentResponse) {}
  rpc StopHostAgent(StopHostAgentRequest) returns (StopHostAgentResponse) {}
  rpc GetLocalCommits(GetLocalCommitsRequest) returns (GetLocalCommitsResponse) {}
  rpc GetRemoteCommits(GetRemoteCommitsRequest) returns (GetRemoteCommitsResponse) {}
  rpc GetCommitDiff(GetCommitDiffRequest) returns (GetCommitDiffResponse) {}
  rpc ExecuteSql(ExecuteSqlRequest) returns (ExecuteSqlResponse) {}
}

message InitRequest {
  string username = 1;
  string name = 2;
  string organisation = 3;
}

message InitResponse {
}

message UserDevice {
  string id = 1;
  string name = 2;
  string public_key = 3;
  string public_key_wireguard = 4;
}

message GetUserDevicesRequest {
}

message GetUserDevicesResponse {
