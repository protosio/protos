  string private = 2;
}

message App {
  string id = 1;
  string name = 2;
  string version = 3;
  string status = 4;
  string instance_name = 5;
  string ip = 6;
  string installer = 7;
  bool persistence = 8;
}

message GetAppsRequest {
}

message GetAppsResponse {
