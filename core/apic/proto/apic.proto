}

message UpdateInstanceResponse {
}

message GetNetworkStateRequest {
  string instance = 1;
}

message GetNetworkStateResponse {
  NetworkState state = 1;
}

message SetNetworkEnabledRequest {
  bool enabled = 1;
}

message SetNetworkEnabledResponse {
  NetworkRuntimeStatus status = 1;
}

message NetworkRuntimeStatus {
  bool supported = 1;
  bool desired_enabled = 2;
  bool enabled = 3;
  string state = 4;
  string message = 5;
  NetworkState network_state = 6;
}

message NetworkState {
  string module = 1;
  bool up = 2;
  string interface_name = 3;
  repeated NetworkAddress addresses = 4;
  repeated NetworkRoute routes = 5;
  repeated WireGuardPeer wireguard_peers = 6;
  repeated FirewallTable firewall_tables = 7;
  repeated DNSState dns = 8;
  repeated string messages = 9;
  repeated NetworkInterface interfaces = 10;
}

message NetworkInterface {
  string name = 1;
  string type = 2;
  int32 index = 3;
  int32 mtu = 4;
  bool up = 5;
  string master = 6;
  string mac_address = 7;
  string kind = 8;
}

message NetworkAddress {
  string interface_name = 1;
  string cidr = 2;
  string scope = 3;
}

message NetworkRoute {
  string interface_name = 1;
  string destination = 2;
  string gateway = 3;
  string source = 4;
  string family = 5;
  string table = 6;
  string protocol = 7;
  string scope = 8;
  string priority = 9;
  string kind = 10;
}

message WireGuardPeer {
  string public_key = 1;
  string endpoint = 2;
  repeated string allowed_ips = 3;
  string latest_handshake = 4;
  uint64 rx_bytes = 5;
  uint64 tx_bytes = 6;
}

message FirewallTable {
  string family = 1;
  string name = 2;
  repeated FirewallChain chains = 3;
}

message FirewallChain {
  string name = 1;
  string type = 2;
  string hook = 3;
  string priority = 4;
  repeated FirewallRule rules = 5;
}

message FirewallRule {
  repeated string expressions = 1;
  uint64 packets = 2;
  uint64 bytes = 3;
}

message DNSState {
  string scope = 1;
  string domain = 2;
  repeated string servers = 3;
  int32 port = 4;
  bool active = 5;
  string source = 6;
}

message ExitRoute {
  string id = 1;
  string device_id = 2;
  string instance_id = 3;
  string instance_name = 4;
  string public_ip = 5;
  string location = 6;
  string status = 7;
  string dns_server = 8;
  repeated string cidrs = 9;
}

message GetExitRoutesRequest {
  string instance = 1;
}

message GetExitRoutesResponse {
  repeated ExitRoute routes = 1;
}

message GetMobileTunnelConfigRequest {
  string instance = 1;
  string device_id = 2;
  string dns_server = 3;
  repeated string cidrs = 4;
}

message MobileTunnelConfig {
  string config_id = 1;
  int64 generated_at_unix = 2;
  string instance_id = 3;
  string instance_name = 4;
  string peer_public_key = 5;
  string peer_endpoint = 6;
  repeated string interface_addresses = 7;
  repeated string dns_servers = 8;
  repeated string included_routes = 9;
  repeated string excluded_routes = 10;
  int32 mtu = 11;
  repeated string allowed_ips = 12;
  int32 persistent_keepalive_seconds = 13;
  string keychain_access_group = 14;
  string keychain_account = 15;
  string wireguard_private_key = 16;
}

message GetMobileTunnelConfigResponse {
  MobileTunnelConfig config = 1;
}

message GetRuntimeStateRequest {
  string instance = 1;
  bool allow_stale = 2;
}

message GetRuntimeStateResponse {
  RuntimeState state = 1;
}

message WatchChangesRequest {
  bool include_snapshot = 1;
  uint32 heartbeat_interval_ms = 2;
}

message WatchChangesResponse {
  uint64 sequence = 1;
  repeated string table_names = 2;
  bool runtime_changed = 3;
  string reason = 4;
}

message Task {
  string id = 1;
  string stream = 2;
  string subject_type = 3;
  string subject_id = 4;
  string status = 5;
  string title = 6;
  string message = 7;
  int32 progress = 8;
  string payload_json = 9;
  string result_json = 10;
  string error_message = 11;
  int32 attempts = 12;
  int32 max_attempts = 13;
  string created_at = 14;
  string updated_at = 15;
  string started_at = 16;
  string finished_at = 17;
  string owner_peer_id = 18;
}

message TaskEvent {
  string id = 1;
  string task_id = 2;
  string status = 3;
  string message = 4;
  int32 progress = 5;
  string details_json = 6;
  string created_at = 7;
}

message GetTasksRequest {
  string status = 1;
  string stream = 2;
  string subject_type = 3;
  string subject_id = 4;
  int32 max_results = 5;
  string instance = 6;
}

message GetTasksResponse {
  repeated Task tasks = 1;
  bool truncated = 2;
}

message GetTaskRequest {
  string id = 1;
  bool include_events = 2;
  string instance = 3;
}

message GetTaskResponse {
  Task task = 1;
  repeated TaskEvent events = 2;
}

message TaskProgressUpdate {
  string task_id = 1;
  string status = 2;
  string message = 3;
  int32 progress = 4;
  string details_json = 5;
  string created_at = 6;
  // True when the task state was saved and its local root published; this is not Swarmion event applied_durably or content durability.
  bool durable = 7;
}

message WatchTaskRequest {
  string id = 1;
  bool include_snapshot = 2;
  bool include_events = 3;
  uint32 heartbeat_interval_ms = 4;
}

message WatchTaskResponse {
  uint64 sequence = 1;
  Task task = 2;
  repeated TaskEvent events = 3;
  TaskProgressUpdate update = 4;
  bool heartbeat = 5;
}

message SetExitRouteRequest {
  string instance = 1;
  string device_id = 2;
  string dns_server = 3;
  repeated string cidrs = 4;
}

message SetExitRouteResponse {
  ExitRoute route = 1;
}

message ClearExitRouteRequest {
  string device_id = 1;
}

message ClearExitRouteResponse {
}

message RuntimeState {
  string peer_id = 1;
  string manifest_digest = 2;
  string checkpoint_root_hash = 3;
  string tentative_root_hash = 4;
  string protocol_checkpoint_root_hash = 5;
  string durable_main_root_hash = 6;
  repeated string state_providers = 10;
  // Deprecated: compatibility alias for routed_peers. It does not describe physical libp2p connections.
  repeated string connected_peers = 11;
  string fatal_state = 12;
  bool runtime_refresh_pending = 13;
  string runtime_refresh_last_error = 14;
  bool runtime_checkpoint_pending = 15;
  string runtime_checkpoint_last_error = 16;
  string runtime_materialization_policy = 17;
  repeated RuntimePeerStatus peer_statuses = 18;
  repeated RuntimeCompatibility compatibility = 19;
  repeated string content_sync_trace = 20;
  string protocol_checkpoint_digest = 24;
  string read_consistency = 25;
  string read_error = 26;
  // Exact-event content_dissent observations recorded by this backend process.
  uint64 event_receipt_content_dissent_observations = 27;
  // Swarmion peers for which the application-owned transport has a route.
  repeated string routed_peers = 28;
  // Routed peers participating in this Swarmion database scope.
  repeated string participating_peers = 29;
  // The bounded Swarmion messaging overlay. This is not physical connectivity.
  repeated string logical_peers = 30;
  int32 logical_peer_target = 31;
  // Peers with a live connection on the application-owned physical host.
  repeated string physical_connected_peers = 32;
}

message RuntimePeerStatus {
  string peer_id = 1;
  // Deprecated: compatibility alias for routed.
  bool connected = 2;
  // Deprecated: compatibility alias for routed. Swarmion no longer reports speculative dialability as database reachability.
  bool dialable = 3;
  bool state_provider = 4;
  bool compatible = 7;
  bool incompatible = 8;
  bool ignored = 9;
  bool relay_only = 10;
  repeated string addresses = 11;
  map<string, string> last_dial_errors = 12;
  string reason = 13;
  int32 replication_priority = 14;
  string replication_device_class = 15;
  bool routed = 16;
  bool participating = 17;
  bool logical = 18;
  bool physical_connected = 19;
  int64 last_routed_at_unix_nano = 20;
}

message RuntimeCompatibility {
  string peer_id = 1;
  string local_digest = 2;
  string remote_digest = 3;
  bool compatible = 4;
  bool blocking = 5;
  string reason = 6;
}

