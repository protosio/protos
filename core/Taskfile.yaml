version: "3"

vars:
  TIMEOUT: '{{.TIMEOUT | default "5m"}}'
  GO_TOOLCHAIN: '{{.GO_TOOLCHAIN | default "go1.26.6"}}'
  GO_TEST_CACHE: '{{.GO_TEST_CACHE | default "/tmp/protos-gocache"}}'
  NATIVE_GO_TAGS: '{{.NATIVE_GO_TAGS | default "dolt_purego_zstd,gms_pure_go"}}'
  SWARMION_CHECKPOINT_SCHEDULER_PROFILE: '{{.SWARMION_CHECKPOINT_SCHEDULER_PROFILE | default "single_node_development"}}'
  E2E_PROBE_IMAGE: '{{.E2E_PROBE_IMAGE | default "docker.io/protosio/protos-e2e-probe:latest"}}'
  E2E_PROBE_LARGE_IMAGE: '{{.E2E_PROBE_LARGE_IMAGE | default "docker.io/protosio/protos-e2e-probe:large-local"}}'
  E2E_IMAGE_REGISTRY_IMAGE: '{{.E2E_IMAGE_REGISTRY_IMAGE | default "docker.io/library/nginx:alpine"}}'
  E2E_PROBE_IMAGE_PLATFORM: '{{.E2E_PROBE_IMAGE_PLATFORM | default "linux/amd64"}}'
  E2E_PROBE_IMAGE_PLATFORMS: '{{.E2E_PROBE_IMAGE_PLATFORMS | default "linux/amd64,linux/arm64"}}'
  E2E_PROBE_IMAGE_ARCHIVE: '{{.E2E_PROBE_IMAGE_ARCHIVE | default ".tmp/protos-e2e-probe.tar.gz"}}'
  E2E_PROBE_LARGE_IMAGE_ARCHIVE: '{{.E2E_PROBE_LARGE_IMAGE_ARCHIVE | default ".tmp/protos-e2e-probe-large.tar.gz"}}'
  E2E_PROBE_LARGE_PAYLOAD_MIB: '{{.E2E_PROBE_LARGE_PAYLOAD_MIB | default "128"}}'
  E2E_MIXED_CLOUD_SUMMARY: '{{.E2E_MIXED_CLOUD_SUMMARY | default ".tmp/mixed-cloud-e2e-summary.json"}}'
  E2E_HETZNER_ENV: '{{.E2E_HETZNER_ENV | default "../.env-hetzner"}}'
  E2E_SCALEWAY_ENV: '{{.E2E_SCALEWAY_ENV | default "../.env-scaleway"}}'
  E2E_SCALEWAY_LOCATION: '{{.E2E_SCALEWAY_LOCATION | default "fr-par-1"}}'
  E2E_PROBE_SMOKE_PORT: '{{.E2E_PROBE_SMOKE_PORT | default "18080"}}'
  E2E_PROBE_BUILDER: '{{.E2E_PROBE_BUILDER | default "protos-e2e-probe-builder"}}'
  IMAGE_ARCHIVE: '{{.IMAGE_ARCHIVE | default ""}}'
  IMAGE_REF: '{{.IMAGE_REF | default ""}}'
  HOSTAGENT_BIN: '{{.HOSTAGENT_BIN | default "../bin/protos-hostagent"}}'
  HOSTAGENT_SOCKET: '{{.HOSTAGENT_SOCKET | default "/var/run/protos-hostagent.sock"}}'
  HOSTAGENT_WORK_DIR: '{{.HOSTAGENT_WORK_DIR | default "/Library/Application Support/Protos/hostagent"}}'
  FLUTTER_APP: '{{.FLUTTER_APP | default ""}}'
  APIC_SOCKET: '{{.APIC_SOCKET | default "~/.protos/protos.socket"}}'
  PROVISIONER: '{{.PROVISIONER | default ""}}'
  LOCATION: '{{.LOCATION | default ""}}'
  OLDER_THAN: '{{.OLDER_THAN | default ""}}'

env:
  GOTOOLCHAIN: '{{.GO_TOOLCHAIN}}'
  GOPRIVATE: '{{.GOPRIVATE | default "github.com/nustiueudinastea/swarmion"}}'
  GONOSUMDB: '{{.GONOSUMDB | default "github.com/nustiueudinastea/swarmion"}}'

tasks:
  generate:
    desc: Generate all artifacts from CUE contracts
    cmds:
      - task: generate:contracts

  generate:contracts:
    desc: Generate protobuf, DB migrations, DB models, and Swarmion SQL catalog from CUE
    cmds:
      - ./scripts/generate-contracts.sh

  generate:protobuf:
    desc: Generate protobuf sources and Go stubs from CUE
    cmds:
      - ./scripts/generate-protobuf.sh

  verify:contracts:
    desc: Verify checked-in generated artifacts match CUE contracts
    cmds:
      - ./scripts/verify-contracts.sh

  verify:
    desc: Run contracts, tests, quality, security, and critical dependency freshness checks
    cmds:
      - task: verify:contracts
      - task: test
      - task: quality
      - task: deps:freshness

  quality:
    desc: Run code quality and vulnerability checks
    cmds:
      - task: lint
      - task: deadcode
      - task: deps:security

  deps:check:
    desc: Run vulnerability and critical dependency freshness checks
    cmds:
      - task: deps:security
      - task: deps:freshness

  deps:security:
    desc: Run govulncheck with the canonical pure-Go backend tags
    cmds:
      - |
        set -e
        if command -v govulncheck >/dev/null 2>&1; then
          vuln_cmd="govulncheck"
        else
          vuln_cmd="go run golang.org/x/vuln/cmd/govulncheck@latest"
        fi
        env \
          GOCACHE={{.GO_TEST_CACHE}} \
          CGO_ENABLED=0 \
          GOFLAGS="${GOFLAGS:--tags={{.NATIVE_GO_TAGS}}}" \
          ${vuln_cmd} ./...
      - for:
          - ../clients/cli
          - network/modules/ipc
          - network/modules/networkextension
          - network/modules/wireguard
        cmd: |
          cd {{.ITEM}}
          if command -v govulncheck >/dev/null 2>&1; then
            vuln_cmd="govulncheck"
          else
            vuln_cmd="go run golang.org/x/vuln/cmd/govulncheck@latest"
          fi
          env \
            GOCACHE={{.GO_TEST_CACHE}} \
            CGO_ENABLED=0 \
            GOFLAGS="${GOFLAGS:--tags={{.NATIVE_GO_TAGS}}}" \
            ${vuln_cmd} ./...

  deps:freshness:
    desc: Check critical runtime, Swarmion, API, and cloud SDK dependencies against upstream
    cmds:
      - env GOCACHE={{.GO_TEST_CACHE}} CGO_ENABLED=0 GOFLAGS="${GOFLAGS:--tags={{.NATIVE_GO_TAGS}}}" go run ./scripts/check-critical-deps.go

  lint:
    desc: Run golangci-lint
    cmds:
      - |
        set -e
        if command -v golangci-lint >/dev/null 2>&1; then
          lint_cmd="golangci-lint"
        else
          lint_cmd="go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest"
        fi
        env \
          GOCACHE={{.GO_TEST_CACHE}} \
          CGO_ENABLED=0 \
          GOFLAGS="${GOFLAGS:--tags={{.NATIVE_GO_TAGS}}}" \
          ${lint_cmd} run --config .golangci.yml --timeout {{.TIMEOUT}} ./...
      - for:
          - network/modules/ipc
          - network/modules/networkextension
          - network/modules/wireguard
        cmd: |
          cd {{.ITEM}}
          if command -v golangci-lint >/dev/null 2>&1; then
            lint_cmd="golangci-lint"
          else
            lint_cmd="go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest"
          fi
          env \
            GOCACHE={{.GO_TEST_CACHE}} \
            CGO_ENABLED=0 \
            GOFLAGS="${GOFLAGS:--tags={{.NATIVE_GO_TAGS}}}" \
            ${lint_cmd} run --config ../../../.golangci.yml --timeout {{.TIMEOUT}} ./...

  deadcode:
    desc: Run golang.org/x/tools/cmd/deadcode
    cmds:
      - |
        set -e
        if command -v deadcode >/dev/null 2>&1; then
          deadcode_cmd="deadcode"
        else
          deadcode_cmd="go run golang.org/x/tools/cmd/deadcode@latest"
        fi
        env \
          GOCACHE={{.GO_TEST_CACHE}} \
          CGO_ENABLED=0 \
          ${deadcode_cmd} -tags={{.NATIVE_GO_TAGS}} -test ./...

  test:
    desc: Run Go tests with the native Swarmion/Dolt stack
    cmds:
      - env CGO_ENABLED=0 SWARMION_CHECKPOINT_SCHEDULER_PROFILE={{.SWARMION_CHECKPOINT_SCHEDULER_PROFILE}} GOFLAGS="${GOFLAGS:--tags={{.NATIVE_GO_TAGS}}}" go test -timeout {{.TIMEOUT}} ./...
      - for:
          - network/modules/ipc
          - network/modules/networkextension
          - network/modules/wireguard
        cmd: cd {{.ITEM}} && env CGO_ENABLED=0 SWARMION_CHECKPOINT_SCHEDULER_PROFILE={{.SWARMION_CHECKPOINT_SCHEDULER_PROFILE}} GOFLAGS="${GOFLAGS:--tags={{.NATIVE_GO_TAGS}}}" go test -timeout {{.TIMEOUT}} ./...

  test:go:
    desc: Canonical replacement for raw go test ./... with the backend's pure-Go tags
    cmds:
      - task: test

  test:focused:
    desc: Run a focused core Go package or test with the canonical pure-Go tags
    requires:
      vars: [PACKAGE]
    cmds:
      - env CGO_ENABLED=0 SWARMION_CHECKPOINT_SCHEDULER_PROFILE={{.SWARMION_CHECKPOINT_SCHEDULER_PROFILE}} GOFLAGS="${GOFLAGS:--tags={{.NATIVE_GO_TAGS}}}" go test -timeout {{.TIMEOUT}} {{.TEST_ARGS}} {{.PACKAGE}}

  image:load:
    desc: Load a local image tar or tar.gz into the Protos app runtime
    cmds:
      - |
        set -e
        if [ -z "{{.IMAGE_ARCHIVE}}" ]; then
          echo "IMAGE_ARCHIVE is required" >&2
          exit 2
        fi
        ref_arg=""
        if [ -n "{{.IMAGE_REF}}" ]; then
          ref_arg="--ref {{.IMAGE_REF}}"
        fi
        env CGO_ENABLED=0 GOFLAGS="${GOFLAGS:--tags={{.NATIVE_GO_TAGS}}}" go run ./cmd/protosd image load $ref_arg "{{.IMAGE_ARCHIVE}}"

  hostagent:build:
    desc: Build protos-hostagent
    cmds:
      - mkdir -p "$(dirname "{{.HOSTAGENT_BIN}}")"
      - env CGO_ENABLED=0 GOFLAGS="${GOFLAGS:--tags={{.NATIVE_GO_TAGS}}}" go build -o "{{.HOSTAGENT_BIN}}" ./cmd/protos-hostagent

  hostagent:run:
    desc: Run protos-hostagent
    cmds:
      - '"{{.HOSTAGENT_BIN}}" --socket "{{.HOSTAGENT_SOCKET}}" --work-dir "{{.HOSTAGENT_WORK_DIR}}" {{.CLI_ARGS}}'

  hostagent:run:root:
    desc: Run protos-hostagent as root
    cmds:
      - |
        hostagent_bin="$(cd "$(dirname "{{.HOSTAGENT_BIN}}")" && pwd)/$(basename "{{.HOSTAGENT_BIN}}")"
        sudo -n "$hostagent_bin" \
          --socket "{{.HOSTAGENT_SOCKET}}" \
          --work-dir "{{.HOSTAGENT_WORK_DIR}}" \
          --socket-mode 0660 \
          --socket-uid "$(id -u)" \
          --socket-gid "$(id -g)" \
          {{.CLI_ARGS}}

  hostagent:stop:
    desc: Stop a running protos-hostagent for the selected socket
    cmds:
      - '"{{.HOSTAGENT_BIN}}" --socket "{{.HOSTAGENT_SOCKET}}" --stop-existing {{.CLI_ARGS}}'

  e2e:full:
    desc: Run local macOS and mixed-cloud E2E harnesses in the validated order
    cmds:
      - task: e2e:preflight
      - task: e2e:local-macos
      - task: e2e:mixed-cloud
      - task: e2e:summary

  e2e:preflight:
    desc: Validate local, host-agent, Docker, cloud credential, and image prerequisites before E2E
    deps:
      - hostagent:build
    cmds:
      - env CGO_ENABLED=0 GOFLAGS="${GOFLAGS:--tags={{.NATIVE_GO_TAGS}}}" go run ./scripts/e2e-preflight --hostagent-bin "{{.HOSTAGENT_BIN}}" --local-image "../cloud-provisioning/targets/output/mactest" --hetzner-image "../cloud-provisioning/targets/output/hetzner/hetzner-bios.img" --scaleway-image "../cloud-provisioning/targets/output/scaleway/scaleway-efi.iso" --hetzner-env "{{.E2E_HETZNER_ENV}}" --scaleway-env "{{.E2E_SCALEWAY_ENV}}" --scaleway-zone "{{.E2E_SCALEWAY_LOCATION}}" --probe-archive "{{.E2E_PROBE_IMAGE_ARCHIVE}}" --summary "{{.E2E_MIXED_CLOUD_SUMMARY}}"

  e2e:summary:
    desc: Print and validate the mixed-cloud E2E summary artifact
    cmds:
      - env CGO_ENABLED=0 GOFLAGS="${GOFLAGS:--tags={{.NATIVE_GO_TAGS}}}" go run ./scripts/e2e-summary --summary "{{.E2E_MIXED_CLOUD_SUMMARY}}"

  e2e:local-macos:
    desc: Run the local macOS VM E2E harness
    deps:
      - hostagent:build
    cmds:
      - task -t ../clients/macos/Taskfile.yml build
      - env CGO_ENABLED=0 GOFLAGS="${GOFLAGS:--tags={{.NATIVE_GO_TAGS}}}" go run ./integration-tests/local-macos-e2e --flutter-app "{{.FLUTTER_APP}}" --hostagent-bin "{{.HOSTAGENT_BIN}}" {{.CLI_ARGS}}

  e2e:local-macos:image-registry:
    desc: Run the local macOS VM E2E harness with Protos P2P app-image resolution enabled
    deps:
      - hostagent:build
    cmds:
      - task -t ../clients/macos/Taskfile.yml build
      - env CGO_ENABLED=0 GOFLAGS="${GOFLAGS:--tags={{.NATIVE_GO_TAGS}}}" go run ./integration-tests/local-macos-e2e --flutter-app "{{.FLUTTER_APP}}" --hostagent-bin "{{.HOSTAGENT_BIN}}" --instances 2 --app-image {{.E2E_IMAGE_REGISTRY_IMAGE}} {{.CLI_ARGS}}

  e2e:mixed-cloud:
    desc: Run the mixed local plus Hetzner plus Scaleway cloud VM E2E harness
    deps:
      - hostagent:build
      - e2e:probe-image:archive
    cmds:
      - task: e2e:preflight
      - task: verify:contracts
      - task -t ../clients/macos/Taskfile.yml build
      - env CGO_ENABLED=0 GOFLAGS="${GOFLAGS:--tags={{.NATIVE_GO_TAGS}}}" go run ./integration-tests/mixed-cloud-e2e --flutter-app "{{.FLUTTER_APP}}" --hostagent-bin "{{.HOSTAGENT_BIN}}" --hetzner-env {{.E2E_HETZNER_ENV}} --scaleway-env {{.E2E_SCALEWAY_ENV}} --app-image {{.E2E_PROBE_IMAGE}} --seed-image-archive {{.E2E_PROBE_IMAGE_ARCHIVE}} --summary-artifact "{{.E2E_MIXED_CLOUD_SUMMARY}}" {{.CLI_ARGS}}

  e2e:probe-image:build:
    desc: Build the Protos E2E app probe container image locally
    cmds:
      - docker buildx build --platform {{.E2E_PROBE_IMAGE_PLATFORM}} --load -f cmd/protos-e2e-probe/Dockerfile -t {{.E2E_PROBE_IMAGE}} .

  e2e:probe-image:build:large:
    desc: Build a large Protos E2E probe image for sustained P2P transfer validation
    cmds:
      - docker buildx build --platform {{.E2E_PROBE_IMAGE_PLATFORM}} --build-arg PROTOS_E2E_PROBE_PAYLOAD_MIB={{.E2E_PROBE_LARGE_PAYLOAD_MIB}} --load -f cmd/protos-e2e-probe/Dockerfile -t {{.E2E_PROBE_LARGE_IMAGE}} .

  e2e:probe-image:archive:
    desc: Build and save the Protos E2E app probe image as a local tar.gz archive
    deps:
      - e2e:probe-image:build
    cmds:
      - |
        set -e
        mkdir -p "$(dirname "{{.E2E_PROBE_IMAGE_ARCHIVE}}")"
        docker save {{.E2E_PROBE_IMAGE}} | gzip -c > "{{.E2E_PROBE_IMAGE_ARCHIVE}}"
        test -s "{{.E2E_PROBE_IMAGE_ARCHIVE}}"

  e2e:probe-image:archive:large:
    desc: Build and save a large Protos E2E probe image archive for sustained P2P transfer validation
    deps:
      - e2e:probe-image:build:large
    cmds:
      - |
        set -e
        mkdir -p "$(dirname "{{.E2E_PROBE_LARGE_IMAGE_ARCHIVE}}")"
        docker save {{.E2E_PROBE_LARGE_IMAGE}} | gzip -c > "{{.E2E_PROBE_LARGE_IMAGE_ARCHIVE}}"
        test -s "{{.E2E_PROBE_LARGE_IMAGE_ARCHIVE}}"

  e2e:mixed-cloud:large-transfer:
    desc: Run mixed-cloud E2E with a larger app-image archive to validate sustained P2P transfer
    cmds:
      - task: e2e:probe-image:archive:large
      - task: e2e:preflight
        vars:
          E2E_PROBE_IMAGE_ARCHIVE: "{{.E2E_PROBE_LARGE_IMAGE_ARCHIVE}}"
      - task: verify:contracts
      - task -t ../clients/macos/Taskfile.yml build
      - env CGO_ENABLED=0 GOFLAGS="${GOFLAGS:--tags={{.NATIVE_GO_TAGS}}}" go run ./integration-tests/mixed-cloud-e2e --flutter-app "{{.FLUTTER_APP}}" --hostagent-bin "{{.HOSTAGENT_BIN}}" --hetzner-env {{.E2E_HETZNER_ENV}} --scaleway-env {{.E2E_SCALEWAY_ENV}} --app-image {{.E2E_PROBE_LARGE_IMAGE}} --seed-image-archive {{.E2E_PROBE_LARGE_IMAGE_ARCHIVE}} --summary-artifact "{{.E2E_MIXED_CLOUD_SUMMARY}}" {{.CLI_ARGS}}

  e2e:probe-image:push:
    desc: Build and push the Protos E2E app probe container image to Docker Hub
    cmds:
      - |
        set -e
        if ! docker buildx inspect {{.E2E_PROBE_BUILDER}} >/dev/null 2>&1; then
          docker buildx create --name {{.E2E_PROBE_BUILDER}} --driver docker-container --bootstrap >/dev/null
        fi
        docker buildx build --builder {{.E2E_PROBE_BUILDER}} --platform {{.E2E_PROBE_IMAGE_PLATFORMS}} --push -f cmd/protos-e2e-probe/Dockerfile -t {{.E2E_PROBE_IMAGE}} .

  e2e:probe-image:smoke:
    desc: Smoke test the local Protos E2E app probe container image
    deps:
      - e2e:probe-image:build
    cmds:
      - |
        set -e
        name="protos-e2e-probe-smoke-$$"
        cleanup() {
          docker rm -f "$name" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT
        docker run --platform {{.E2E_PROBE_IMAGE_PLATFORM}} --rm -d --name "$name" -p 127.0.0.1:{{.E2E_PROBE_SMOKE_PORT}}:8080 {{.E2E_PROBE_IMAGE}} >/dev/null
        for attempt in $(seq 1 30); do
          if curl -fsS "http://127.0.0.1:{{.E2E_PROBE_SMOKE_PORT}}/healthz" >/dev/null 2>&1; then
            break
          fi
          if [ "$attempt" -eq 30 ]; then
            echo "probe image did not become healthy" >&2
            exit 1
          fi
          sleep 1
        done
        body="$(curl -fsS "http://127.0.0.1:{{.E2E_PROBE_SMOKE_PORT}}/probe?target=http%3A%2F%2F127.0.0.1%3A8080%2F")"
        case "$body" in
          *'"ok":true'*)
            ;;
          *)
            echo "probe image self-check failed: $body" >&2
            exit 1
            ;;
        esac

  release:audit:
    desc: Dry-run audit of Protos cloud images through the local APIC node
    cmds:
      - |
        set -e
        if [ -z "{{.PROVISIONER}}" ]; then
          echo "PROVISIONER is required" >&2
          exit 2
        fi
        set -- --unix-socket "{{.APIC_SOCKET}}" release audit "{{.PROVISIONER}}"
        if [ -n "{{.LOCATION}}" ]; then
          set -- "$@" --location "{{.LOCATION}}"
        fi
        if [ -n "{{.OLDER_THAN}}" ]; then
          set -- "$@" --older-than "{{.OLDER_THAN}}"
        fi
        env CGO_ENABLED=0 GOFLAGS="${GOFLAGS:--tags={{.NATIVE_GO_TAGS}}}" go run ../clients/cli "$@"

  default:
    desc: Show available tasks
    cmds:
      - task --list
