syntax = "proto3";

package hostagent;


option go_package = "github.com/protosio/protos/internal/hostagent/proto;proto";

service HostAgent {
  rpc Apply(ApplyRequest) returns (ApplyResponse) {}
  rpc Status(StatusRequest) returns (StatusResponse) {}
  rpc VMLogs(VMLogsRequest) returns (VMLogsResponse) {}
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse) {}
}

message ApplyRequest {
  HostDesiredState desired_state = 1;
}

message ApplyResponse {
  repeated VMObservedState vms = 1;
  NetworkObservedState network = 2;
  string message = 3;
}

message StatusRequest {
  repeated VMRef vms = 1;
  bool network = 2;
  string root_dir = 3;
  bool list_vms = 4;
}

message StatusResponse {
  repeated VMObservedState vms = 1;
  NetworkObservedState network = 2;
  string message = 3;
}

message ShutdownRequest {
}

message ShutdownResponse {
  string message = 1;
}

message VMLogsRequest {
  VMRef vm = 1;
}

message VMLogsResponse {
  string logs = 1;
}

message HostDesiredState {
  repeated VMDesiredState vms = 1;
  NetworkDesiredState network = 2;
}

message VMDesiredState {
  string id = 1;
  string root_dir = 2;
  string desired_state = 3;
  VMConfig config = 4;
}

message VMRef {
  string id = 1;
  string name = 2;
  string root_dir = 3;
}

message VMObservedState {
  string id = 1;
  string status = 2;
  int32 pid = 3;
  string public_ip = 4;
  string message = 5;
  VMConfig config = 6;
}

message VMConfig {
  string id = 1;
  string name = 2;
  string image_id = 3;
  string location = 4;
  string machine_type = 5;
  uint32 cores = 6;
  uint32 memory_mib = 7;
  string init_origin_public_key = 8;
  string public_ip = 9;
  string mac_address = 10;
  string kernel_path = 11;
  string initrd_path = 12;
  string cmdline_path = 13;
  string root_disk_path = 14;
  string boot_iso_path = 15;
  string metadata_iso = 16;
  string artifact_dir = 17;
  VMNetworkConfig network = 18;
  repeated VMVolume volumes = 19;
}

message VMNetworkConfig {
  string interface = 1;
  string ip_address = 2;
  int32 prefix_length = 3;
  string gateway = 4;
  repeated string dns_servers = 5;
}

message VMVolume {
  string id = 1;
  string name = 2;
  string path = 3;
  int32 size_mib = 4;
}

message NetworkDesiredState {
  string desired_state = 1;
  NetworkConfig config = 2;
  repeated InstancePeer instances = 3;
  repeated DevicePeer devices = 4;
  repeated NamespacedInterface namespaced_interfaces = 5;
  bool reconcile_peers = 6;
  repeated ExitRoute exit_routes = 7;
}

message NetworkConfig {
  string ipv6_address = 1;
  string wireguard_private_key = 2;
  string domain = 3;
  string ipv4_address = 4;
  string local_peer_id = 5;
}

message InstancePeer {
  string id = 1;
  string name = 2;
  string public_key = 3;
  string public_ip = 4;
  repeated string routes = 5;
  string ipv4_address = 6;
}

message DevicePeer {
  string name = 1;
  string public_key = 2;
  string id = 3;
  string ipv4_address = 4;
}

message NamespacedInterface {
  string netns_path = 1;
  string ip = 2;
}

message ExitRoute {
  string id = 1;
  string device_id = 2;
  string instance_id = 3;
  repeated string cidrs = 4;
}

message NetworkObservedState {
  string module = 1;
  bool up = 2;
  string message = 3;
  NetworkState state = 4;
}

message NetworkState {
  string module = 1;
  bool up = 2;
  string interface_name = 3;
  repeated NetworkAddress addresses = 4;
  repeated NetworkRoute routes = 5;
  repeated WireGuardPeer wireguard_peers = 6;
  repeated FirewallTable firewall_tables = 7;
  repeated DNSState dns = 8;
  repeated string messages = 9;
  repeated NetworkInterface interfaces = 10;
}

message NetworkInterface {
  string name = 1;
  string type = 2;
  int32 index = 3;
  int32 mtu = 4;
  bool up = 5;
  string master = 6;
  string mac_address = 7;
  string kind = 8;
}

message NetworkAddress {
  string interface_name = 1;
  string cidr = 2;
  string scope = 3;
}

message NetworkRoute {
  string interface_name = 1;
  string destination = 2;
  string gateway = 3;
  string source = 4;
  string family = 5;
  string table = 6;
  string protocol = 7;
  string scope = 8;
  string priority = 9;
  string kind = 10;
}

message WireGuardPeer {
  string public_key = 1;
  string endpoint = 2;
  repeated string allowed_ips = 3;
  string latest_handshake = 4;
  uint64 rx_bytes = 5;
  uint64 tx_bytes = 6;
}

message FirewallTable {
  string family = 1;
  string name = 2;
  repeated FirewallChain chains = 3;
}

message FirewallChain {
  string name = 1;
  string type = 2;
  string hook = 3;
  string priority = 4;
  repeated FirewallRule rules = 5;
}

message FirewallRule {
  repeated string expressions = 1;
  uint64 packets = 2;
  uint64 bytes = 3;
}

message DNSState {
  string scope = 1;
  string domain = 2;
  repeated string servers = 3;
  int32 port = 4;
  bool active = 5;
  string source = 6;
}
