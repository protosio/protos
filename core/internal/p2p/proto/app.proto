syntax = "proto3";

package proto;


option go_package = "./proto";

service Apps {
  rpc GetAppLogs(GetAppLogsRequest) returns (GetAppLogsResponse) {}
  rpc GetAppStatus(GetAppStatusRequest) returns (GetAppStatusResponse) {}
  rpc ProbeAppHTTP(ProbeAppHTTPRequest) returns (ProbeAppHTTPResponse) {}
}

message GetAppLogsRequest {
  string app_name = 1;
}

message GetAppLogsResponse {
  string logs = 1;
}

message GetAppStatusRequest {
  string app_name = 1;
}

message GetAppStatusResponse {
  string status = 1;
}

message ProbeAppHTTPRequest {
  string app_name = 1;
  string url = 2;
  int32 timeout_seconds = 3;
  int32 max_bytes = 4;
}

message ProbeAppHTTPResponse {
  bytes body = 1;
  int32 bytes_read = 2;
}
