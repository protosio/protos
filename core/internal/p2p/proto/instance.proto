syntax = "proto3";

package proto;


option go_package = "./proto";

service Instance {
  rpc Init(InitRequest) returns (InitResponse) {}
  rpc GetPeers(GetPeersRequest) returns (GetPeersResponse) {}
  rpc GetLogs(GetLogsRequest) returns (GetLogsResponse) {}
  rpc GetNetworkState(GetNetworkStateRequest) returns (GetNetworkStateResponse) {}
  rpc GetExitRoutes(GetExitRoutesRequest) returns (GetExitRoutesResponse) {}
  rpc GetRuntimeState(GetRuntimeStateRequest) returns (GetRuntimeStateResponse) {}
  rpc GetTasks(GetTasksRequest) returns (GetTasksResponse) {}
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse) {}
  rpc WatchTask(WatchTaskRequest) returns (stream WatchTaskResponse) {}
}

message InitRequest {
  string origin_device = 1;
  string origin_device_public_key = 2;
  repeated string origin_swarmion_addrs = 3;
  string instance_name = 4;
}

message InitResponse {
  string architecture = 1;
}

message GetPeersRequest {
}

message GetPeersResponse {
  map<string, string> peers = 1;
}

message GetLogsRequest {
}

message GetLogsResponse {
  string logs = 1;
}

message GetNetworkStateRequest {
}

message GetNetworkStateResponse {
  NetworkState state = 1;
}

message GetExitRoutesRequest {
}

message GetExitRoutesResponse {
  repeated ExitRoute routes = 1;
}

message GetRuntimeStateRequest {
  bool allow_stale = 1;
}

message GetRuntimeStateResponse {
  RuntimeState state = 1;
}

message Task {
  string id = 1;
  string stream = 2;
  string subject_type = 3;
  string subject_id = 4;
  string status = 5;
  string title = 6;
  string message = 7;
  int32 progress = 8;
  string payload_json = 9;
  string result_json = 10;
  string error_message = 11;
  int32 attempts = 12;
  int32 max_attempts = 13;
  string created_at = 14;
  string updated_at = 15;
  string started_at = 16;
  string finished_at = 17;
  string owner_peer_id = 18;
}

message TaskEvent {
  string id = 1;
  string task_id = 2;
  string status = 3;
  string message = 4;
  int32 progress = 5;
  string details_json = 6;
  string created_at = 7;
}

message GetTasksRequest {
  string status = 1;
  string stream = 2;
  string subject_type = 3;
  string subject_id = 4;
  int32 max_results = 5;
}

message GetTasksResponse {
  repeated Task tasks = 1;
  bool truncated = 2;
}

message GetTaskRequest {
  string id = 1;
  bool include_events = 2;
}

message GetTaskResponse {
  Task task = 1;
  repeated TaskEvent events = 2;
}

message TaskProgressUpdate {
  string task_id = 1;
  string status = 2;
  string message = 3;
  int32 progress = 4;
  string details_json = 5;
  string created_at = 6;
  bool durable = 7;
}

message WatchTaskRequest {
  string id = 1;
  bool include_snapshot = 2;
  bool include_events = 3;
  uint32 heartbeat_interval_ms = 4;
}

message WatchTaskResponse {
  uint64 sequence = 1;
  Task task = 2;
  repeated TaskEvent events = 3;
  TaskProgressUpdate update = 4;
  bool heartbeat = 5;
}

message NetworkState {
  string module = 1;
  bool up = 2;
  string interface_name = 3;
  repeated NetworkAddress addresses = 4;
  repeated NetworkRoute routes = 5;
  repeated WireGuardPeer wireguard_peers = 6;
  repeated FirewallTable firewall_tables = 7;
  repeated DNSState dns = 8;
  repeated string messages = 9;
  repeated NetworkInterface interfaces = 10;
}

message NetworkInterface {
  string name = 1;
  string type = 2;
  int32 index = 3;
  int32 mtu = 4;
  bool up = 5;
  string master = 6;
  string mac_address = 7;
  string kind = 8;
}

message NetworkAddress {
  string interface_name = 1;
  string cidr = 2;
  string scope = 3;
}

message NetworkRoute {
  string interface_name = 1;
  string destination = 2;
  string gateway = 3;
  string source = 4;
  string family = 5;
  string table = 6;
  string protocol = 7;
  string scope = 8;
  string priority = 9;
  string kind = 10;
}

message WireGuardPeer {
  string public_key = 1;
  string endpoint = 2;
  repeated string allowed_ips = 3;
  string latest_handshake = 4;
  uint64 rx_bytes = 5;
  uint64 tx_bytes = 6;
}

message FirewallTable {
  string family = 1;
  string name = 2;
  repeated FirewallChain chains = 3;
}

message FirewallChain {
  string name = 1;
  string type = 2;
  string hook = 3;
  string priority = 4;
  repeated FirewallRule rules = 5;
}

message FirewallRule {
  repeated string expressions = 1;
  uint64 packets = 2;
  uint64 bytes = 3;
}

message DNSState {
  string scope = 1;
  string domain = 2;
  repeated string servers = 3;
  int32 port = 4;
  bool active = 5;
  string source = 6;
}

message ExitRoute {
  string id = 1;
  string device_id = 2;
  string instance_id = 3;
  string status = 4;
  string dns_server = 5;
  repeated string cidrs = 6;
}

message RuntimeState {
  string peer_id = 1;
  string manifest_digest = 2;
  string checkpoint_root_hash = 3;
  string tentative_root_hash = 4;
  string protocol_checkpoint_root_hash = 5;
  string durable_main_root_hash = 6;
  repeated string state_providers = 10;
  repeated string connected_peers = 11;
  string fatal_state = 12;
  bool runtime_refresh_pending = 13;
  string runtime_refresh_last_error = 14;
  bool runtime_checkpoint_pending = 15;
  string runtime_checkpoint_last_error = 16;
  string runtime_materialization_policy = 17;
  repeated RuntimePeerStatus peer_statuses = 18;
  repeated RuntimeCompatibility compatibility = 19;
  repeated string content_sync_trace = 20;
  string protocol_checkpoint_digest = 24;
  string read_consistency = 25;
  string read_error = 26;
}

message RuntimePeerStatus {
  string peer_id = 1;
  bool connected = 2;
  bool dialable = 3;
  bool state_provider = 4;
  bool compatible = 7;
  bool incompatible = 8;
  bool ignored = 9;
  bool relay_only = 10;
  repeated string addresses = 11;
  map<string, string> last_dial_errors = 12;
  string reason = 13;
}

message RuntimeCompatibility {
  string peer_id = 1;
  string local_digest = 2;
  string remote_digest = 3;
  bool compatible = 4;
  bool blocking = 5;
  string reason = 6;
}
