version: "3"

vars:
  LINUXKIT: '{{default "/opt/homebrew/bin/linuxkit" .LINUXKIT}}'
  DOCKER_CONFIG: '{{default "/tmp/protos-dockerconfig-empty" .DOCKER_CONFIG}}'
  DOCKER_HOME: '{{default "/tmp/protos-home" .DOCKER_HOME}}'
  DOCKER_CONTEXT: '{{default "/tmp/protos-docker-context" .DOCKER_CONTEXT}}'
  PROTOS_IMAGE: '{{default "protosio/protosd:local" .PROTOS_IMAGE}}'
  PROTOS_IMAGE_PLATFORM: '{{default "" .PROTOS_IMAGE_PLATFORM}}'
  PROTOS_BUILD_SSH: '{{default "auto" .PROTOS_BUILD_SSH}}'
  PROTOS_BUILD_NETRC: '{{default "" .PROTOS_BUILD_NETRC}}'
  SWARMION_SOURCE: '{{default "" .SWARMION_SOURCE}}'
  NATIVE_GO_TAGS: '{{default "dolt_purego_zstd,gms_pure_go" .NATIVE_GO_TAGS}}'
  TARGETS: ./targets
  WORKDIR: ./targets/output

tasks:
  image-contracts:
    desc: Print provider image build contracts from CUE.
    cmds:
      - cue export --out yaml -e '#protosImage' {{.TARGETS}}/target_common.cue {{.TARGETS}}/target_scaleway.cue
      - cue export --out yaml -e '#protosImage' {{.TARGETS}}/target_common.cue {{.TARGETS}}/target_hetzner.cue
      - cue export --out yaml -e '#protosImage' {{.TARGETS}}/target_common.cue {{.TARGETS}}/target_mactest.cue
      - cue export --out yaml -e '#protosImage' {{.TARGETS}}/target_common.cue {{.TARGETS}}/target_macdev.cue

  cloud:
    desc: Build cloud images in the canonical provider order.
    cmds:
      - task scaleway
      - task hetzner

  output-dir:
    internal: true
    cmds:
      - mkdir -p {{.WORKDIR}}
      - mkdir -p {{.DOCKER_CONFIG}}
      - mkdir -p {{.DOCKER_HOME}}
      - printf '{}\n' > {{.DOCKER_CONFIG}}/config.json
      - |
        mkdir -p {{.DOCKER_HOME}}/.ssh
        if [ -f "$HOME/.ssh/protos.pub" ]; then
          cp "$HOME/.ssh/protos.pub" {{.DOCKER_HOME}}/.ssh/protos.pub
        fi

  pkg:
    desc: Build local LinuxKit packages.
    cmds:
      - mkdir -p {{.DOCKER_CONFIG}}
      - mkdir -p {{.DOCKER_HOME}}
      - printf '{}\n' > {{.DOCKER_CONFIG}}/config.json
      - |
        HOST_HOME="$HOME"
        DOCKER_CONFIG={{.DOCKER_CONFIG}} HOME={{.DOCKER_HOME}} LINUXKIT_CACHE="${LINUXKIT_CACHE:-$HOST_HOME/.linuxkit/cache}" {{.LINUXKIT}} pkg build pkg/containerd
      - |
        HOST_HOME="$HOME"
        DOCKER_CONFIG={{.DOCKER_CONFIG}} HOME={{.DOCKER_HOME}} LINUXKIT_CACHE="${LINUXKIT_CACHE:-$HOST_HOME/.linuxkit/cache}" {{.LINUXKIT}} pkg build --network pkg/dev

  protosd-image:
    desc: Build the local protosd container image used by LinuxKit targets.
    cmds:
      - rm -rf {{.DOCKER_CONTEXT}}
      - |
        mkdir -p {{.DOCKER_CONTEXT}}/backend/core
        rsync -a --delete \
          --exclude '.git' \
          --exclude 'local-macos-vms' \
          --exclude '**/local-macos-vms' \
          --exclude 'tmp' \
          --exclude '**/tmp' \
          --exclude '*.raw' \
          --exclude '*.img' \
          --exclude '*.iso' \
          --exclude '*.log' \
          ../core/ {{.DOCKER_CONTEXT}}/backend/core
      - |
        if [ -n "{{.SWARMION_SOURCE}}" ]; then
          swarmion_source="$(cd "{{.SWARMION_SOURCE}}" && pwd)"
          for module in \
            protocol \
            runtime \
            transports \
            transport-adapters \
            schema-engines/cue \
            schema-engines/declarative
          do
            if [ ! -f "$swarmion_source/$module/go.mod" ]; then
              echo "Swarmion source module is missing: $swarmion_source/$module/go.mod" >&2
              exit 1
            fi
            mkdir -p "{{.DOCKER_CONTEXT}}/swarmion/$(dirname "$module")"
            rsync -a --delete \
              --exclude '.git' \
              --exclude '.claude' \
              --exclude 'perf-artifacts' \
              --exclude 'tmp' \
              --exclude '*.log' \
              "$swarmion_source/$module/" \
              "{{.DOCKER_CONTEXT}}/swarmion/$module/"
          done
          (
            cd "{{.DOCKER_CONTEXT}}"
            go work init \
              ./backend/core \
              ./swarmion/protocol \
              ./swarmion/runtime \
              ./swarmion/transports \
              ./swarmion/transport-adapters \
              ./swarmion/schema-engines/cue \
              ./swarmion/schema-engines/declarative
            go work edit -go=1.26.4
          )
        fi
      - |
        platform_args=""
        if [ -n "{{.PROTOS_IMAGE_PLATFORM}}" ]; then
          platform_args="--platform {{.PROTOS_IMAGE_PLATFORM}}"
        fi

        ssh_args=""
        case "{{.PROTOS_BUILD_SSH}}" in
          auto|default)
            if [ -n "${SSH_AUTH_SOCK:-}" ] && command -v ssh-add >/dev/null 2>&1 && ssh-add -l >/dev/null 2>&1; then
              ssh_args="--ssh default"
            fi
            ;;
          none|false|off)
            ;;
          *)
            ssh_args="--ssh {{.PROTOS_BUILD_SSH}}"
            ;;
        esac

        secret_args=""
        netrc_cleanup=""
        if [ -n "{{.PROTOS_BUILD_NETRC}}" ]; then
          secret_args="--secret id=github_netrc,src={{.PROTOS_BUILD_NETRC}}"
        elif [ -n "${GITHUB_TOKEN:-}" ]; then
          netrc_cleanup="$(mktemp)"
          chmod 600 "$netrc_cleanup"
          printf 'machine github.com login x-access-token password %s\n' "$GITHUB_TOKEN" > "$netrc_cleanup"
          secret_args="--secret id=github_netrc,src=$netrc_cleanup"
        elif command -v gh >/dev/null 2>&1 && gh auth token >/dev/null 2>&1; then
          netrc_cleanup="$(mktemp)"
          chmod 600 "$netrc_cleanup"
          token="$(gh auth token)"
          printf 'machine github.com login x-access-token password %s\n' "$token" > "$netrc_cleanup"
          unset token
          secret_args="--secret id=github_netrc,src=$netrc_cleanup"
        fi

        if [ -n "$netrc_cleanup" ]; then
          trap 'rm -f "$netrc_cleanup"' EXIT
        fi
        if [ -z "$ssh_args" ] && [ -z "$secret_args" ]; then
          echo "No GitHub credentials are available for the Docker build. Load an SSH key, set GITHUB_TOKEN, pass PROTOS_BUILD_NETRC=/path/to/netrc, or pass PROTOS_BUILD_SSH=<id|path>." >&2
          exit 1
        fi
        DOCKER_BUILDKIT=1 docker build $platform_args $ssh_args $secret_args -f {{.DOCKER_CONTEXT}}/backend/core/Dockerfile --build-arg PROTOS_BUILD_DIR=backend/core --build-arg PROTOS_NATIVE_GO_TAGS={{.NATIVE_GO_TAGS}} -t {{.PROTOS_IMAGE}} {{.DOCKER_CONTEXT}}

  macdev:
    desc: Build the local macOS development kernel+initrd and EFI initrd ISO images.
    deps: [output-dir]
    cmds:
      - rm -rf {{.WORKDIR}}/macdev
      - mkdir {{.WORKDIR}}/macdev
      - cue export --out yaml {{.TARGETS}}/target_common.cue {{.TARGETS}}/target_macdev.cue > {{.WORKDIR}}/macdev/macdev.yaml
      - |
        arch="$(cue export --out text -e '#protosImage.linuxkit.arch' {{.TARGETS}}/target_common.cue {{.TARGETS}}/target_macdev.cue)"
        format_a="$(cue export --out text -e '#protosImage.linuxkit.formats[0]' {{.TARGETS}}/target_common.cue {{.TARGETS}}/target_macdev.cue)"
        format_b="$(cue export --out text -e '#protosImage.linuxkit.formats[1]' {{.TARGETS}}/target_common.cue {{.TARGETS}}/target_macdev.cue)"
        HOST_HOME="$HOME"
        DOCKER_CONFIG={{.DOCKER_CONFIG}} HOME={{.DOCKER_HOME}} LINUXKIT_CACHE="${LINUXKIT_CACHE:-$HOST_HOME/.linuxkit/cache}" {{.LINUXKIT}} build --docker --arch "$arch" --format "$format_a" --format "$format_b" --dir {{.WORKDIR}}/macdev {{.WORKDIR}}/macdev/macdev.yaml
      - truncate -s "$(cue export --out text -e '#protosImage.linuxkit.imageSize' {{.TARGETS}}/target_common.cue {{.TARGETS}}/target_macdev.cue)" {{.WORKDIR}}/macdev/macdev-disk.img

  mactest:
    desc: Build the local macOS test kernel+initrd and EFI initrd ISO images.
    deps: [output-dir, protosd-image]
    cmds:
      - rm -rf {{.WORKDIR}}/mactest
      - mkdir {{.WORKDIR}}/mactest
      - cue export --out yaml {{.TARGETS}}/target_common.cue {{.TARGETS}}/target_mactest.cue > {{.WORKDIR}}/mactest/mactest.yaml
      - |
        arch="$(cue export --out text -e '#protosImage.linuxkit.arch' {{.TARGETS}}/target_common.cue {{.TARGETS}}/target_mactest.cue)"
        format_a="$(cue export --out text -e '#protosImage.linuxkit.formats[0]' {{.TARGETS}}/target_common.cue {{.TARGETS}}/target_mactest.cue)"
        format_b="$(cue export --out text -e '#protosImage.linuxkit.formats[1]' {{.TARGETS}}/target_common.cue {{.TARGETS}}/target_mactest.cue)"
        HOST_HOME="$HOME"
        DOCKER_CONFIG={{.DOCKER_CONFIG}} HOME={{.DOCKER_HOME}} LINUXKIT_CACHE="${LINUXKIT_CACHE:-$HOST_HOME/.linuxkit/cache}" {{.LINUXKIT}} build --docker --arch "$arch" --format "$format_a" --format "$format_b" --dir {{.WORKDIR}}/mactest {{.WORKDIR}}/mactest/mactest.yaml
      - truncate -s "$(cue export --out text -e '#protosImage.linuxkit.imageSize' {{.TARGETS}}/target_common.cue {{.TARGETS}}/target_mactest.cue)" {{.WORKDIR}}/mactest/mactest-disk.img

  scaleway:
    desc: Build the Scaleway AMD64 EFI ISO image.
    deps: [output-dir]
    cmds:
      - task protosd-image PROTOS_IMAGE_PLATFORM=linux/amd64
      - rm -rf {{.WORKDIR}}/scaleway
      - mkdir {{.WORKDIR}}/scaleway
      - cue export --out yaml {{.TARGETS}}/target_common.cue {{.TARGETS}}/target_scaleway.cue > {{.WORKDIR}}/scaleway/scaleway.yaml
      - |
        arch="$(cue export --out text -e '#protosImage.linuxkit.arch' {{.TARGETS}}/target_common.cue {{.TARGETS}}/target_scaleway.cue)"
        format="$(cue export --out text -e '#protosImage.linuxkit.formats[0]' {{.TARGETS}}/target_common.cue {{.TARGETS}}/target_scaleway.cue)"
        firmware="$(cue export --out text -e '#protosImage.boot.firmware' {{.TARGETS}}/target_common.cue {{.TARGETS}}/target_scaleway.cue)"
        if [ "$firmware:$format" != "uefi:iso-efi" ]; then
          echo "Scaleway image contract must be uefi:iso-efi, got $firmware:$format" >&2
          exit 1
        fi
        HOST_HOME="$HOME"
        DOCKER_DEFAULT_PLATFORM=linux/amd64 DOCKER_CONFIG={{.DOCKER_CONFIG}} HOME={{.DOCKER_HOME}} LINUXKIT_CACHE="${LINUXKIT_CACHE:-$HOST_HOME/.linuxkit/cache}" {{.LINUXKIT}} build --docker --arch "$arch" --format "$format" --dir {{.WORKDIR}}/scaleway {{.WORKDIR}}/scaleway/scaleway.yaml

  hetzner:
    desc: Build the Hetzner AMD64 BIOS raw disk image.
    deps: [output-dir]
    cmds:
      - task protosd-image PROTOS_IMAGE_PLATFORM=linux/amd64
      - rm -rf {{.WORKDIR}}/hetzner
      - mkdir {{.WORKDIR}}/hetzner
      - cue export --out yaml {{.TARGETS}}/target_common.cue {{.TARGETS}}/target_hetzner.cue > {{.WORKDIR}}/hetzner/hetzner.yaml
      - |
        arch="$(cue export --out text -e '#protosImage.linuxkit.arch' {{.TARGETS}}/target_common.cue {{.TARGETS}}/target_hetzner.cue)"
        format="$(cue export --out text -e '#protosImage.linuxkit.formats[0]' {{.TARGETS}}/target_common.cue {{.TARGETS}}/target_hetzner.cue)"
        firmware="$(cue export --out text -e '#protosImage.boot.firmware' {{.TARGETS}}/target_common.cue {{.TARGETS}}/target_hetzner.cue)"
        if [ "$firmware:$format" != "bios:raw-bios" ]; then
          echo "Hetzner image contract must be bios:raw-bios, got $firmware:$format" >&2
          exit 1
        fi
        HOST_HOME="$HOME"
        DOCKER_DEFAULT_PLATFORM=linux/amd64 DOCKER_CONFIG={{.DOCKER_CONFIG}} HOME={{.DOCKER_HOME}} LINUXKIT_CACHE="${LINUXKIT_CACHE:-$HOST_HOME/.linuxkit/cache}" {{.LINUXKIT}} build --docker --arch "$arch" --format "$format" --dir {{.WORKDIR}}/hetzner {{.WORKDIR}}/hetzner/hetzner.yaml

  syncstart:
    desc: Start a Mutagen sync session into the local VM.
    vars:
      VM_IP:
        sh: |
          if [ -n "${VM_IP:-}" ]; then
            printf '%s\n' "$VM_IP"
            exit 0
          fi
          vm_dir="${PROTOS_VM_DIR:-$HOME/.protos/local-macos-vms}"
          find "$vm_dir/instances" -name manifest.json -type f 2>/dev/null \
            | while IFS= read -r manifest; do
                sed -n 's/.*"public_ip": "\([^"]*\)".*/\1/p' "$manifest"
              done \
            | tail -n1
    cmds:
      - |
        if [ -z "$PROTOS_SRC" ]; then
          echo "PROTOS_SRC environment variable is not set"
          exit 1
        fi
        echo "PROTOS_SRC is set to: $PROTOS_SRC"
      - 'echo "Using VM IP: {{.VM_IP}}"'
      - echo "Starting mutagen daemon"
      - mutagen daemon start
      - mutagen sync create "$PROTOS_SRC" root@{{.VM_IP}}:/var/lib/src

  syncstop:
    desc: Stop the active Mutagen sync session.
    cmds:
      - |
        identifier=$(mutagen sync list | grep -oE 'Identifier: (.*)' | cut -d ' ' -f 2)
        if [ -z "$identifier" ]; then
          echo "No sync endpoint found"
        else
          echo "Terminating sync: $identifier"
          mutagen sync terminate "$identifier"
        fi
      - 'echo "Stopping mutagen daemon"'
      - mutagen daemon stop

  stopvm:
    desc: Send SIGHUP to the LinuxKit runner process.
    cmds:
      - |
        pid=$(ps aux | grep linuxkit | grep -v grep | awk '{print $2}')
        if [ -z "$pid" ]; then
          echo "linuxkit process not found"
        else
          echo "Sending SIGHUP to linuxkit process with PID $pid"
          kill -HUP "$pid"
        fi
