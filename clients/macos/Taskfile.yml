version: "3"

vars:
  RUN_ARGS: '{{.RUN_ARGS | default ""}}'
  BUILD_ARGS: '{{.BUILD_ARGS | default "--debug"}}'
  APP_PATH: '{{.APP_PATH | default "build/macos/Build/Products/Debug/ProtosFlutter.app"}}'

tasks:
  native:build:
    desc: Build the embedded Go core for the macOS Flutter app
    cmds:
      - ../shared/flutter/scripts/build-native.sh macos .

  run:
    desc: Run the macOS Flutter app using ~/.protos
    deps:
      - native:build
    env:
      PROTOS_MACOS_TASK_ENTRY: "1"
    cmds:
      - ./scripts/run.sh {{.RUN_ARGS}} {{.CLI_ARGS}}

  build:
    desc: Build the macOS Flutter app
    deps:
      - native:build
    env:
      PROTOS_MACOS_TASK_ENTRY: "1"
    cmds:
      - ./scripts/build.sh {{.BUILD_ARGS}} {{.CLI_ARGS}}

  launch:built:
    desc: Launch the already-built macOS app bundle
    cmds:
      - |
        set -e
        app_path="{{.APP_PATH}}"
        if [ ! -d "$app_path" ]; then
          echo "Built app bundle not found at $app_path. Run build first." >&2
          exit 1
        fi
        open "$app_path"

  clean:data:
    desc: Remove ~/.protos
    cmds:
      - rm -rf ~/.protos

  analyze:
    desc: Analyze the macOS Flutter app
    cmds:
      - flutter analyze

  test:
    desc: Run shared Flutter tests used by the macOS client
    dir: ../shared/flutter
    cmds:
      - flutter test

  default:
    desc: Show available macOS tasks
    cmds:
      - task --list
